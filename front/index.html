<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academia Valhalla</title>
  <!-- Fija el tema antes de pintar para que no haya un destello claro: oscuro salvo que el usuario eligiera claro -->
  <script>
    (function () {
      var claro = false;
      try { claro = localStorage.getItem('theme') === 'light'; } catch (e) {}
      if (!claro) document.documentElement.classList.add('dark');
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
