<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Un bicho con corona de rey y gafas de sol bajo un estandarte que dice It works on my machine">
  <title>Leyenda del debugging</title>
  <circle cx="64" cy="64" r="60" fill="#3b0764"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#fbbf24" stroke-width="4"/>
  <g stroke="#fbbf24" stroke-width="2" opacity=".5" stroke-linecap="round">
    <path d="M64 8v10M24 24l7 7M104 24l-7 7M8 64h10M110 64h10"/>
  </g>
  <!-- laureles -->
  <g fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round">
    <path d="M30 100q-14-22-4-48"/><path d="M98 100q14-22 4-48"/>
  </g>
  <g fill="#4ade80">
    <ellipse cx="22" cy="78" rx="5" ry="3" transform="rotate(-30 22 78)"/><ellipse cx="25" cy="64" rx="5" ry="3" transform="rotate(-10 25 64)"/>
    <ellipse cx="106" cy="78" rx="5" ry="3" transform="rotate(30 106 78)"/><ellipse cx="103" cy="64" rx="5" ry="3" transform="rotate(10 103 64)"/>
  </g>
  <!-- bicho rey -->
  <g transform="translate(64 66)">
    <path d="M-22 2l-14 4M-22 14l-14 10M22 2l14 4M22 14l14 10" stroke="#e9d5ff" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="0" cy="10" rx="24" ry="26" fill="#a855f7"/>
    <path d="M0-14v50" stroke="#581c87" stroke-width="2.5"/>
    <circle cx="-10" cy="16" r="4" fill="#581c87"/><circle cx="11" cy="24" r="4" fill="#581c87"/>
    <circle cx="0" cy="-12" r="15" fill="#581c87"/>
    <!-- gafas de sol -->
    <rect x="-13" y="-19" width="12" height="9" rx="3" fill="#000"/><rect x="1" y="-19" width="12" height="9" rx="3" fill="#000"/>
    <path d="M-1-15h2" stroke="#000" stroke-width="2"/>
    <path d="M-10-17l3 0M4-17l3 0" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M-6-4q6 5 12 0" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- corona -->
    <path d="M-12-26l-3-14 8 7 7-11 7 11 8-7-3 14z" fill="#fbbf24" stroke="#92400e" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="0" cy="-37" r="2" fill="#ef4444"/>
  </g>
  <!-- cinta -->
  <g>
    <path d="M14 102h100v16H14z" fill="#fbbf24"/>
    <path d="M14 102l-8 8 8 8zM114 102l8 8-8 8z" fill="#b45309"/>
    <text x="64" y="114" text-anchor="middle" font-family="monospace" font-weight="700" font-size="9.5" fill="#3b0764">works on my machine</text>
  </g>
</svg>
